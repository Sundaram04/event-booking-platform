spring.application.name=event-booking-platform

server.port=8083

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/event_booking_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Event2026}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=WARN
logging.level.com.eventbooking.event_booking_platform=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=WARN

jwt.secret=${JWT_SECRET:dev-only-please-change-32-chars-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}


spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eventbooking.eventbookingplatform.event