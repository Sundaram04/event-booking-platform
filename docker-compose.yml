services:
    postgres:
        image: postgres:16
        container_name: eventbooking-postgres

        environment:
            POSTGRES_DB: event_booking_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password_here}

        ports:
            - "5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"

    backend:
        build: .
        container_name: eventbooking-backend

        depends_on:
            postgres:
                condition: service_healthy

        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/event_booking_db
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-your_password_here}

        ports:
            - "8080:8080"

    kafka:
        image: apache/kafka:3.7.0
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
    postgres_data:
