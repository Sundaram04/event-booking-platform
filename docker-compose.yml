services:
    postgres:
        image: postgres:16
        container_name: eventbooking-postgres

        environment:
            POSTGRES_DB: event_booking_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password_here}

        ports:
            - "5432:5432"

        volumes:
            - postgres_data:/var/lib/postgresql/data

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"

    backend:
        build: .
        container_name: eventbooking-backend

        depends_on:
            postgres:
                condition: service_healthy

        environment:
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/event_booking_db
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-your_password_here}

        ports:
            - "8080:8080"

volumes:
    postgres_data:
